log4cplus.rootLogger=ALL,  ALL_MSGS, running_log

log4cplus.appender.ALL_MSGS=log4cplus::ConsoleAppender
log4cplus.appender.ALL_MSGS.layout=log4cplus::PatternLayout
log4cplus.appender.ALL_MSGS.layout.ConversionPattern=%d{%m/%d/%y %H:%M:%S} [%t] %-5p %c{2} [%x] - %m [%l]%n

log4cplus.appender.running_log=log4cplus::DailyRollingFileAppender
log4cplus.appender.running_log.File=logs/running_msgs.log
log4cplus.appender.running_log.ReopenDelay=10
log4cplus.appender.running_log.Append = true
log4cplus.appender.running_log.ImmediateFlush = false
log4cplus.appender.running_log.CreateDirs = true
log4cplus.appender.running_log.layout=log4cplus::TTCCLayout
log4cplus.appender.running_log.Schedule=DAILY
log4cplus.appender.running_log.MaxBackupIndex=3
log4cplus.appender.running_log.RollOnClose = true

log4cplus.appender.running_log.filters.1=log4cplus::spi::LogLevelRangeFilter
log4cplus.appender.running_log.filters.1.LogLevelMin=INFO
log4cplus.appender.running_log.filters.1.LogLevelMax=ERROR
log4cplus.appender.running_log.filters.1.AcceptOnMatch=true
log4cplus.appender.running_log.filters.2=log4cplus::spi::DenyAllFilter
 
